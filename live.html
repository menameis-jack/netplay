<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e5a3a">
<title>NetPlay Queue Live</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#16231c;--mut:#5b6b62;--line:#dcd7ca;--grn:#0e5a3a;--grnink:#fff;--acc:#e8a317;--bad:#b3261e;--ok:#1b8a4b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a14;--card:#16251c;--ink:#eaf2ec;--mut:#9db1a5;--line:#27392e;--grn:#2f9a68;--grnink:#06150d;--acc:#f0b73a;--bad:#ff8a80;--ok:#5ad08c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--grn);color:var(--grnink);padding:14px 16px 12px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header .wrap{padding:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:19px;margin:0;letter-spacing:.2px}
select{font:inherit;font-size:14px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.stat{display:flex;align-items:center;gap:8px;margin:12px 0 2px;font-size:14px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok);animation:p 2s infinite}.dot.old{background:var(--acc)}.dot.bad{background:var(--bad)}
@keyframes p{50%{opacity:.35}}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ch{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);margin-bottom:6px}
.ch b{color:var(--ink);font-size:15px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vs .t{font-weight:650;font-size:16px}.vs .t div{padding:1px 0}
.vs .x{color:var(--mut);font-size:13px;font-weight:700}
.vs .t:last-child{text-align:end}
.nx{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}
.nxn{margin-bottom:8px}.nxn small{display:block;color:var(--mut);margin-bottom:4px}
ol{list-style:none;margin:0;padding:0}
ol li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
ol li:last-child{border-bottom:0}
.pos{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
li:nth-child(1) .pos{background:var(--acc);color:#1a1200}
.nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lvl{display:inline-block;min-width:20px;text-align:center;font-size:12px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-inline-start:4px}
.wl{font-size:14px;color:var(--mut);white-space:nowrap}.wl b{color:var(--ink)}
.empty{color:var(--mut);padding:6px 2px}
.gpd{font-size:13px;color:var(--mut);margin:-4px 2px 8px}
.demo{background:var(--acc);color:#1a1200;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;margin:12px 0 0}
.msg{margin:30px 0;text-align:center;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 16px 30px}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="ttl">NetPlay Queue</h1>
<select id="lang" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="fil">Filipino</option><option value="hi">हिन्दी</option></select></div></header>
<main class="wrap">
<div class="stat"><span class="dot" id="dot"></span><span id="st"></span></div>
<div id="out"></div>
</main>
<footer id="ft"></footer>
<script>
var DB="https://netplayqueue-e959e-default-rtdb.asia-southeast1.firebasedatabase.app";
var POLL=5000,OLD=120000;
var T={
en:{end:"This session has ended. Thanks for playing!",demo:"Demo with sample names. Your real live page shows your own players.",ttl:"NetPlay Queue Live",play:"Playing now",next:"Next up",rank:"Ranking",court:"Court",none:"No games are being played right now.",nonext:"Nobody is lined up yet.",norank:"The ranking appears after the first game.",live:"Live. Updated",ago:"s ago",agom:"min ago",wait:"Loading...",gone:"This live page has ended or is not available. Ask the organizer for a new link.",quiet:"No update for a while. The organizer may be offline.",offline:"No internet. Trying again...",min:"min",w:"W",l:"L",gp:"GP",gpd:"GP = games played",ft:"Updates by themselves. You do not need to refresh.",bad:"Badminton",pick:"Pickleball"},
ar:{end:"انتهت الجلسة. شكرًا للعب!",demo:"عرض تجريبي بأسماء وهمية. صفحتك المباشرة الحقيقية تعرض لاعبيك.",ttl:"NetPlay Queue مباشر",play:"يلعبون الآن",next:"التالي",rank:"الترتيب",court:"ملعب",none:"لا توجد مباريات الآن.",nonext:"لا أحد في الانتظار بعد.",norank:"يظهر الترتيب بعد المباراة الأولى.",live:"مباشر. آخر تحديث منذ",ago:"ث",agom:"د",wait:"جارٍ التحميل...",gone:"انتهت هذه الصفحة أو لم تعد متاحة. اطلب رابطًا جديدًا من المنظم.",quiet:"لا تحديث منذ فترة. قد يكون المنظم غير متصل.",offline:"لا يوجد إنترنت. تتم إعادة المحاولة...",min:"د",w:"ف",l:"خ",gp:"مباريات",gpd:"مباريات = عدد المباريات التي لُعبت",ft:"يتحدث تلقائيًا. لا حاجة لتحديث الصفحة.",bad:"ريشة طائرة",pick:"بيكل بول"},
fil:{end:"Tapos na ang session. Salamat sa paglalaro!",demo:"Demo ito na may sample na pangalan. Ang tunay mong live page ay nagpapakita ng sarili mong mga manlalaro.",ttl:"NetPlay Queue Live",play:"Naglalaro ngayon",next:"Susunod",rank:"Ranking",court:"Court",none:"Walang laro ngayon.",nonext:"Wala pang naka-pila.",norank:"Lalabas ang ranking pagkatapos ng unang laro.",live:"Live. Na-update",ago:"s ang nakalipas",agom:"min ang nakalipas",wait:"Naglo-load...",gone:"Tapos na o hindi available ang live page na ito. Humingi ng bagong link sa organizer.",quiet:"Matagal nang walang update. Maaaring offline ang organizer.",offline:"Walang internet. Sinusubukan ulit...",min:"min",w:"P",l:"T",gp:"GP",gpd:"GP = bilang ng laro",ft:"Kusang nag-a-update. Hindi mo kailangang mag-refresh.",bad:"Badminton",pick:"Pickleball"},
hi:{end:"सेशन समाप्त हो गया। खेलने के लिए धन्यवाद!",demo:"यह नमूना नामों वाला डेमो है। आपका असली लाइव पेज आपके अपने खिलाड़ी दिखाएगा।",ttl:"NetPlay Queue लाइव",play:"अभी खेल रहे हैं",next:"अगले",rank:"रैंकिंग",court:"कोर्ट",none:"अभी कोई खेल नहीं चल रहा।",nonext:"अभी कोई कतार में नहीं है।",norank:"पहले खेल के बाद रैंकिंग दिखेगी।",live:"लाइव। अपडेट",ago:"से पहले (सेकंड)",agom:"मिनट पहले",wait:"लोड हो रहा है...",gone:"यह लाइव पेज समाप्त हो गया है या उपलब्ध नहीं है। आयोजक से नया लिंक माँगें।",quiet:"काफ़ी देर से अपडेट नहीं आया। आयोजक ऑफ़लाइन हो सकता है।",offline:"इंटरनेट नहीं है। फिर कोशिश हो रही है...",min:"मि.",w:"जी",l:"हा",gp:"GP",gpd:"GP = खेले गए मैच",ft:"अपने आप अपडेट होता है। रिफ़्रेश करने की ज़रूरत नहीं।",bad:"बैडमिंटन",pick:"पिकलबॉल"}
};
var q=new URLSearchParams(location.search),code=(q.get("c")||"").replace(/[^a-z0-9]/gi,"").toLowerCase(),L=q.get("l");
try{if(!L)L=localStorage.getItem("np-live-lang")}catch(e){}
if(!L||!T[L]){var nl=(navigator.language||"en").slice(0,2);L=nl==="ar"?"ar":nl==="hi"?"hi":(nl==="fi"||nl==="tl")?"fil":"en"}
var D=null,lastOk=0,state="wait",timer=0;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tx(){return T[L]||T.en}
function setLang(l){L=T[l]?l:"en";try{localStorage.setItem("np-live-lang",L)}catch(e){}document.documentElement.lang=L==="fil"?"fil":L;document.documentElement.dir=L==="ar"?"rtl":"ltr";$("lang").value=L;$("ft").textContent=tx().ft;draw()}
function agoTxt(ms){var s=Math.max(0,Math.round(ms/1000)),t=tx();return s<60?s+" "+t.ago:Math.round(s/60)+" "+t.agom}
function arr(x){return Array.isArray(x)?x:(x&&typeof x==="object"?Object.keys(x).map(function(k){return x[k]}):[])}
function draw(){
  var t=tx(),dot=$("dot"),st=$("st"),out=$("out");document.title=t.ttl;$("ttl").textContent=t.ttl;
  if(state==="gone"){dot.className="dot bad";st.textContent="";out.innerHTML='<p class="msg">'+esc(t.gone)+'</p>';return}
  if(!D){dot.className="dot";st.textContent=state==="offline"?t.offline:t.wait;out.innerHTML="";return}
  var age=Date.now()-(+D.t||lastOk);
  if(age>43200000&&code!=="demo"){dot.className="dot bad";st.textContent="";out.innerHTML='<p class="msg">'+esc(t.gone)+'</p>';return}
  if(state==="offline"){dot.className="dot old";st.textContent=t.offline}
  else if(age>OLD){dot.className="dot old";st.textContent=t.quiet+" ("+agoTxt(age)+")"}
  else{dot.className="dot ok";st.textContent=t.live+" "+agoTxt(age)}
  var h=D.e?'<div class="demo">'+esc(t.end)+'</div>':"",c=arr(D.courts),n=arr(D.next),r=arr(D.rk);if(code==="demo")h='<div class="demo">'+esc(t.demo)+'</div>';
  h+='<h2>'+esc(t.play)+(D.sp&&t[D.sp]?' · '+esc(t[D.sp]):'')+'</h2>';
  if(!c.length)h+='<div class="card empty">'+esc(t.none)+'</div>';
  c.forEach(function(x){var mins=(x.el!=null)?Math.max(0,Math.floor(((+x.el||0)+Math.max(0,Date.now()-(+D.t||lastOk)))/60000)):null;
    h+='<div class="card"><div class="ch"><b>'+esc(t.court)+' '+esc(x.n)+'</b><span>'+esc(x.cat||"")+(mins!=null?' · '+mins+' '+esc(t.min):'')+'</span></div><div class="vs"><div class="t">'+arr(x.a).map(function(p){return'<div>'+esc(p)+'</div>'}).join("")+'</div><div class="x">VS</div><div class="t">'+arr(x.b).map(function(p){return'<div>'+esc(p)+'</div>'}).join("")+'</div></div></div>'});
  h+='<h2>'+esc(t.next)+'</h2>';
  if(!n.length)h+='<div class="card empty">'+esc(t.nonext)+'</div>';
  else h+='<div class="card">'+n.map(function(g,i){return'<div class="nxn">'+(n.length>1?'<small>#'+(i+1)+'</small>':'')+'<div class="nx">'+arr(g).map(function(p){return'<span class="chip">'+esc(p)+'</span>'}).join("")+'</div></div>'}).join("")+'</div>';
  h+='<h2>'+esc(t.rank)+'</h2><div class="gpd">'+esc(t.gpd)+'</div>';
  if(!r.length)h+='<div class="card empty">'+esc(t.norank)+'</div>';
  else h+='<div class="card" style="padding:2px 0"><ol>'+r.map(function(p,i){return'<li><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(p.n)+(p.l?' <span class="lvl">'+esc(p.l)+'</span>':'')+'</span><span class="wl"><b>'+(+p.w||0)+'</b> '+esc(t.w)+' &nbsp;<b>'+(+p.x||0)+'</b> '+esc(t.l)+' &nbsp;·&nbsp; <b>'+(+p.p||0)+'</b> '+esc(t.gp)+'</span></li>'}).join("")+'</ol></div>';
  out.innerHTML=h}

var DEMO=null;
function demoStep(){
  var now=Date.now(),i;
  if(!DEMO){
    var nm=["Maria","Ahmed","Jun","Priya","Carlos","Aisha","Ken","Lina","Omar","Grace","Rafi","Sofia","Dan","Nadia","Leo","Mika"],P={};
    nm.forEach(function(n){P[n]={n:n,w:0,x:0,p:0}});
    DEMO={P:P,q:nm.slice(8),cs:[{n:1,cat:"Men's Double",a:nm.slice(0,2),b:nm.slice(2,4),t0:now-9*60000,end:now+8000},{n:2,cat:"Mixed Double",a:nm.slice(4,6),b:nm.slice(6,8),t0:now-3*60000,end:now+22000}]};
    DEMO.P.Maria.w=2;DEMO.P.Maria.p=3;DEMO.P.Ahmed.w=2;DEMO.P.Ahmed.p=3;DEMO.P.Jun.w=1;DEMO.P.Jun.x=2;DEMO.P.Jun.p=3;DEMO.P.Priya.w=1;DEMO.P.Priya.p=1;DEMO.P.Carlos.x=1;DEMO.P.Carlos.p=1;
  }
  var cats=["Men's Double","Mixed Double","Women's Double"];
  DEMO.cs.forEach(function(c){
    if(now<c.end)return;
    var win=Math.random()<.5?c.a:c.b,lose=win===c.a?c.b:c.a;
    win.forEach(function(n){DEMO.P[n].w++;DEMO.P[n].p++});lose.forEach(function(n){DEMO.P[n].x++;DEMO.P[n].p++});
    DEMO.q=DEMO.q.concat(c.a,c.b);var nx=DEMO.q.splice(0,4);
    c.a=nx.slice(0,2);c.b=nx.slice(2,4);c.t0=now;c.end=now+20000+Math.random()*25000;c.cat=cats[Math.floor(Math.random()*cats.length)]});
  var rk=Object.keys(DEMO.P).map(function(k){var o=DEMO.P[k];o.l=o.l||["I","A","B","I","O"][o.n.length%5];return o}).filter(function(p){return p.p>0}).sort(function(a,b){return b.w-a.w||a.x-b.x||b.p-a.p||a.n.localeCompare(b.n)}).slice(0,12);
  var q=DEMO.q.slice();
  return{t:now,sp:"",courts:DEMO.cs.map(function(c){return{n:c.n,cat:c.cat,a:c.a,b:c.b,el:now-c.t0}}),next:[q.slice(0,4)],rk:rk}}

async function poll(){
  clearTimeout(timer);
  if(code==="demo"){D=demoStep();state="ok";lastOk=Date.now();draw();timer=setTimeout(poll,POLL);return}
  if(!code||!DB){state="gone";draw();return}
  if(!document.hidden){
    try{var r=await fetch(DB.replace(/\/+$/,"")+"/s/"+code+".json?t="+Date.now(),{cache:"no-store"});
      if(!r.ok)throw new Error(r.status);var j=await r.json();
      if(j===null){state="gone";D=null}else{D=j;state="ok";lastOk=Date.now()}}
    catch(e){state=D?"offline":"offline"}
    draw()}
  timer=setTimeout(poll,POLL)}
$("lang").onchange=function(){setLang(this.value)};
document.addEventListener("visibilitychange",function(){if(!document.hidden)poll()});
window.addEventListener("online",poll);
setInterval(function(){if(D&&state!=="gone")draw()},1000);
setLang(L);poll();
</script>
</body>
</html>
