<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<title>NetPlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5ef;--surface:#fff;--ink:#12261f;--mute:#5d6f67;--line:#d5ddd4;--court:#1f5f4a;--court-ink:#fff;--cork:#e9b44c;--cork-ink:#2a1d00;--danger:#b3412f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a15;--surface:#16271f;--ink:#e9f0ea;--mute:#98aaa1;--line:#2a4237;--court:#2c8266;--danger:#e37a66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a15;--surface:#16271f;--ink:#e9f0ea;--mute:#98aaa1;--line:#2a4237;--court:#2c8266;--danger:#e37a66;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:26px;font-weight:800;margin:4px 0 12px;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cork);outline-offset:2px}
select,input{padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%;font-size:15px}
select option{color:var(--ink);background:var(--surface)}
.court{background:var(--court);color:var(--court-ink);border-radius:16px;padding:14px;position:relative;border:2px solid #fff3;margin-bottom:12px;box-shadow:0 6px 18px #0002}
.court.m::before{content:"";position:absolute;left:50%;top:58px;bottom:14px;border-left:2px dashed #fff5}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chead b{font-size:18px;font-weight:800}
.chead select{flex:1;padding:6px 8px;font-size:14px}
.chead .tm{margin-left:auto;font-size:15px;font-weight:700}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:20px;position:relative}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.names{font-size:18px;font-weight:800;line-height:1.3;overflow-wrap:anywhere;min-height:48px}
.streak{font-size:13px;opacity:.85}
.win{background:var(--cork);color:var(--cork-ink);font-weight:800;border-radius:10px;padding:12px 8px;margin-top:auto}
.win:disabled{opacity:.5}
.win:active{transform:scale(.97)}
.wbtn{background:#fff2;border:1.5px solid #fff5;color:#fff;font-weight:700;border-radius:10px;padding:12px 8px}
.pick{display:grid;gap:8px;margin-bottom:10px}
.tl{font-weight:800;font-size:16px;margin-top:4px}
.vs{text-align:center;font-size:13px;opacity:.85}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.over{background:var(--cork);color:var(--cork-ink);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-weight:800}
.over small{display:block;font-weight:500}
.warn{font-size:13px;margin:0 0 8px;color:var(--cork)}
.score{text-align:center;font-size:20px;font-weight:800;padding:8px}
.board li.lead .nm small{color:var(--cork-ink)}
.cdrow{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cd{flex:1;font-weight:800;font-size:15px;min-width:150px}
.cd.up{background:var(--cork);color:var(--cork-ink);border-radius:8px;padding:6px 8px}
.cdb{color:#fff;border-color:#fff5}
.menu{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.menu summary{font-weight:800;cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.clock{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.menu a{color:var(--ink);font-weight:700}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-right:6px;flex:none;vertical-align:-3px}
input:disabled,select:disabled,button:disabled{opacity:.4;cursor:not-allowed}
.win,.wbtn,.btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center}
.em{font-size:15px;font-weight:400;line-height:1.3;overflow-wrap:anywhere}
.av{height:1.2em;width:auto;vertical-align:-.2em;margin-right:6px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--cork);color:var(--cork-ink);white-space:nowrap}
.credit{font-size:12px;color:var(--mute);margin:-8px 0 14px;line-height:1.4}
.lv{font-size:11px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:99px;background:var(--line);color:var(--ink);vertical-align:middle;white-space:nowrap}
.court .lv{background:#fff3;color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 6px}
.seg{display:flex;flex:1;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;padding:9px 4px;background:none;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.step{display:flex;align-items:center;gap:10px;font-weight:700}
.step button{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);font-size:22px;font-weight:700}
.hint{font-size:13px;color:var(--mute);margin:4px 0 14px}
h2{font-size:17px;margin:22px 0 8px;display:flex;align-items:center}
.q,.board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.q li,.board li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.q li.rest{opacity:.55}
.q .pos{min-width:26px;font-size:12px;font-weight:700;color:var(--mute)}
.nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.nm small{display:block;font-weight:500;color:var(--mute)}
.x{background:none;color:var(--danger);font-size:20px;padding:4px 10px;border-radius:8px}
.sm{background:none;border:1.5px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
.btn{background:var(--court);color:var(--court-ink);font-weight:800;border-radius:10px;padding:13px}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
.ghost:disabled{opacity:.4}
.board{counter-reset:r}
.board li{counter-increment:r}
.board li::before{content:counter(r);min-width:18px;font-weight:800;color:var(--mute)}
.board li.lead{background:var(--cork);border-color:var(--cork);color:var(--cork-ink)}
.board li.lead::before{color:var(--cork-ink)}
.board .wl{white-space:nowrap;font-size:14px}
.board .wl b{font-size:17px}
.hist{margin:0;padding-left:18px;color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>NetPlay</h1>

</div>

function takeC(cat,pl){var F=pl.filter(function(p){return p.g==="F"}),M=pl.filter(function(p){return p.g==="M"});
  if(cat==="wd")return F.length>=2?F.slice(0,2):null;
  if(cat==="mn")return M.length>=2?M.slice(0,2):null;
  return F.length&&M.length?[F[0],M[0]]:null}
function best(f,cat){
  var opts=cat==="md"?[[[0,2],[1,3]],[[0,3],[1,2]]]:[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  function rep(a,b){return f[a].last===f[b].id||f[b].last===f[a].id?10:0}
  function sc(o){var a=o[0],b=o[1];return Math.abs(f[a[0]].l+f[a[1]].l-f[b[0]].l-f[b[1]].l)+rep(a[0],a[1])+rep(b[0],b[1])}
  var bo=opts[0];opts.forEach(function(o){if(sc(o)<sc(bo))bo=o});
  var t=bo.map(function(x){return[f[x[0]].id,f[x[1]].id]});return t[0].concat(t[1]);
}
function fill(c){
  c.msg="";var pl=pool(c).map(function(p,i){return{p:p,i:i}}).sort(function(a,b){return a.p.p-b.p.p||a.i-b.i}).map(function(x){return x.p});
  if(c.keep.length){var ch=takeC(c.cat,pl);if(!ch){c.msg="Not enough players waiting.";return}c.sel=[c.keep[0],c.keep[1],ch[0].id,ch[1].id];return}
  var f=take(c.cat,pl);if(!f){c.msg="Not enough players waiting. "+CATS.filter(function(x){return x[0]===c.cat})[0][2];return}
  c.sel=best(f,c.cat);
}
function go(c){if(S.ended){c.msg="The game has ended. Reopen it from the Menu to continue.";return}
  var ids=c.sel;
  var ok=ids.every(function(id){return id&&P(id)&&(S.q.indexOf(id)>=0||c.keep.indexOf(id)>=0)});
  if(!ok){c.msg="Pick four available players.";return}
  var left=c.keep.filter(function(id){return ids.indexOf(id)<0});
  var same=c.keep.indexOf(ids[0])>=0&&c.keep.indexOf(ids[1])>=0;
  S.q=S.q.filter(function(id){return ids.indexOf(id)<0}).concat(left);
  c.run={t:[[ids[0],ids[1]],[ids[2],ids[3]]],t0:Date.now(),end:(+S.lim>0?Date.now()+S.lim*60000:0),al:false,sc:["",""],s:same?c.s:0};
  c.keep=[];c.s=0;c.sel=["","","",""];c.msg="";c.last=null;
}
function result(ci,i){
  var c=S.courts[ci],r=c.run,W=r.t[i],L=r.t[1-i],ms=Date.now()-r.t0,sc=r.sc||["",""],ws="",mg=0;
  if(sc[0]!==""||sc[1]!==""){
    if(sc[0]===""||sc[1]===""){c.msg="Enter both scores, or leave both empty.";return false}
    var wa=+(i===0?sc[0]:sc[1]),la=+(i===0?sc[1]:sc[0]);
    if(wa<=la){c.msg="The scores do not match the winner you tapped.";return false}
    ws=wa+"-"+la;mg=wa-la;
  }
  W.forEach(function(id){var p=P(id);p.w++;p.p++;p.last=W[W[0]===id?1:0]});
  L.forEach(function(id){var p=P(id);p.x++;p.p++;p.last=L[L[0]===id?1:0]});
  var s=(i===0?r.s:0)+1;
  S.h.push("💪 "+plain(W)+" beat 😭 "+plain(L)+(ws?" "+ws+", margin "+mg:"")+" ("+mins(ms)+" on court "+lab(ci)+")");
  S.g.push({ms:ms,c:lab(ci)});c.last={ms:ms,txt:"Won: "+plain(W),sc:ws,mg:mg,w:i};c.msg="";
  S.q=S.q.concat(L);c.run=null;
  if(S.mode==="stay"&&s<S.max){c.keep=W;c.s=s;c.sel=["","","",""]}else{S.q=S.q.concat(W)}
}
function comp(c){
  var s=c.sel.map(P);if(s.some(function(p){return !p}))return"";
  var ok;if(c.cat==="wd")ok=s.every(function(p){return p.g==="F"});
  else if(c.cat==="mn")ok=s.every(function(p){return p.g==="M"});
  else ok=s[0].g!==s[1].g&&s[2].g!==s[3].g;
  return ok?"":"Check teams. "+CATS.filter(function(x){return x[0]===c.cat})[0][2];
}
function opts(arr,sel){return arr.map(function(n,i){return'<option value="'+i+'"'+(String(sel)===String(i)?" selected":"")+'>'+n+'</option>'}).join("")}
function selHtml(c,ci,k){
  var tk=taken(c,k),cur=c.sel[k];
  var av=S.q.map(P).filter(function(p){return !p.rest}).concat(c.keep.map(P)).filter(function(p,i,a){return p&&tk.indexOf(p.id)<0&&a.indexOf(p)===i});
  if(cur&&P(cur)&&!av.some(function(p){return p.id===cur}))av.push(P(cur));
  return'<select data-f="sel" data-c="'+ci+'" data-s="'+k+'" aria-label="'+SL[k]+'"><option value="">'+SL[k]+'</option>'+av.map(function(p){
    return'<option value="'+p.id+'"'+(p.id===cur?" selected":"")+'>'+esc(p.n)+' ('+SH[p.l]+" "+p.g+')</option>'}).join("")+'</select>';
}
function courtHtml(c,ci){
  var cn=CATS.filter(function(x){return x[0]===c.cat})[0][1],h;
  if(c.run){
    h='<section class="court m"><div class="chead"><b>Court '+lab(ci)+'</b><span class="streak">'+cn+'</span><span class="tm">Started '+clk(c.run.t0)+'</span></div><div class="sides">'
    +[0,1].map(function(i){return'<div class="side"><div class="names">'+c.run.t[i].map(function(id){return pn(P(id))}).join("<br>")+'</div><div class="streak">'+(i===0&&c.run.s?"Win streak: "+c.run.s+" of "+S.max:"Team "+"AB".charAt(i))+'</div><input class="score" type="number" inputmode="numeric" min="0" max="99" placeholder="Score" aria-label="Team '+"AB".charAt(i)+' score" data-f="sc" data-c="'+ci+'" data-s="'+i+'" value="'+((c.run.sc||[])[i]||"")+'"><button class="win" data-act="win" data-c="'+ci+'" data-v="'+i+'">💪 Team '+"AB".charAt(i)+' won</button></div>'}).join("")+'</div><p class="streak" id="mg'+ci+'" style="margin:10px 0 0">'+marg(c.run.sc)+'</p>'+(c.msg?'<p class="warn">'+esc(c.msg)+'</p>':'')+'</section>';
    return h;
  }
  h='<section class="court"><div class="chead"><b>Court '+lab(ci)+'</b></div><div class="chead"><select data-f="ccat" data-c="'+ci+'" aria-label="Category">'+CATS.map(function(x){return'<option value="'+x[0]+'"'+(x[0]===c.cat?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select></div>';
  if(c.last)h+='<div class="over">Game over: played '+mins(c.last.ms)+'<small>'+(c.last.w!=null?'💪 Team '+"AB".charAt(c.last.w)+' won, 😭 Team '+"AB".charAt(1-c.last.w)+' lost<br>':'')+(c.last.sc?'Score '+c.last.sc+', won by '+c.last.mg+(c.last.mg===1?' point':' points'):'')+'</small></div>';
  if(c.keep.length)h+='<p class="streak">Winners stay (win '+c.s+' of '+S.max+')</p>';
  h+='<div class="pick"><div class="tl">Team A</div>'+selHtml(c,ci,0)+selHtml(c,ci,1)+'<div class="vs">versus</div><div class="tl">Team B</div>'+selHtml(c,ci,2)+selHtml(c,ci,3)+'</div>';
  var w=comp(c)||c.msg;if(w)h+='<p class="warn">'+esc(w)+'</p>';
  return h+'<div class="pick2"><button class="wbtn" data-act="fill" data-c="'+ci+'">'+ic("wand")+'Auto fill</button><button class="win" data-act="go" data-c="'+ci+'">'+ic("play")+'Start game</button></div></section>';
}
function render(){
  ens();var h="";
  var run=S.courts.filter(function(c){return c.run}).length,dis=run||S.ended?" disabled":"",pin=/^https?:\/\//i.test(S.loc||"");
  h+='<div class="topbar"><span>Total courts: <b>'+S.nc+'</b> ('+esc(labels().join(", "))+')</span>'+(S.ended?'<span class="pill">Game ended</span>':'')+'</div>';
  h+='<details class="menu" id="menu"'+(S.mo===false?"":" open")+'><summary>'+ic("menu")+'Menu: '+dateTxt()+(S.ts||S.te?', '+tt(S.ts)+' to '+tt(S.te):'')+'</summary>'
    +'<label class="hint" style="margin:10px 0 0">Game date<input type="date" data-f="gd" value="'+esc(S.gd)+'"></label>'
    +'<div class="add" style="margin-top:10px"><label class="hint" style="margin:0">Time to start<input type="time" data-f="ts" value="'+esc(S.ts||"")+'"></label><label class="hint" style="margin:0">Time to end<input type="time" data-f="te" value="'+esc(S.te||"")+'"></label></div>'
    +'<label class="hint" style="margin:10px 0 0">Pin location link<input type="url" inputmode="url" data-f="loc" placeholder="Paste a map pin link" value="'+esc(S.loc||"")+'"></label>'
    +(pin?'<p class="hint"><a href="'+esc(S.loc)+'" target="_blank" rel="noopener">Open pin location</a></p>':'')
    
    +'<button class="ghost" style="margin-top:6px" data-act="export">'+ic("down")+'Export game data (CSV)</button><p class="hint" id="xmsg" style="margin:6px 0 0"></p>'+endHtml()+'</details>';
  h+=S.courts.map(courtHtml).join("");
  h+='<div class="row"><label class="hint" style="margin:0;flex:1">Court numbers, for example 1, 3, 5<input data-f="cn" maxlength="40" value="'+esc(S.cn)+'">'+(S.cnmsg?'<span style="color:var(--danger)">'+esc(S.cnmsg)+'</span>':'')+'</label><button class="ghost" style="margin-left:auto" data-act="undo"'+(UNDO.length?"":" disabled")+'>Undo</button></div>';
  h+='<div class="row"><div class="seg" role="group" aria-label="After a game">'
    +'<button data-act="rule" data-v="rot" aria-pressed="'+(S.mode==="rot")+'">Rotate all</button>'
    +'<button data-act="rule" data-v="s2" aria-pressed="'+(S.mode==="stay"&&S.max===2)+'">Winners stay 2</button>'
    +'<button data-act="rule" data-v="s3" aria-pressed="'+(S.mode==="stay"&&S.max===3)+'">Winners stay 3</button></div></div>';
  h+='<p class="hint">'+(S.mode==="rot"
    ?"After a game all four players go to the back of the queue. Pick the next four yourself, or use Auto fill: levels balanced, last partner avoided."
    :"Winners stay on that court for up to "+S.max+" games in a row and are pre-selected. Losers go to the back. Pick or auto-fill the challengers.")+'</p>';
  h+='<label class="hint" for="lvl">Auto fill uses this level</label><select id="lvl" data-f="lvl"><option value="all"'+(S.lvl==="all"?" selected":"")+'>All levels</option>'+opts(LV,S.lvl)+'</select>';
  var cf=S.cf;
  h+='<h2>'+ic("coins")+'Costs</h2><div class="add"><div class="seg full" role="group" aria-label="Cost mode"><button data-act="fx" data-v="0" aria-pressed="'+(!cf.fixed)+'">Split total</button><button data-act="fx" data-v="1" aria-pressed="'+(!!cf.fixed)+'">Fixed amount</button></div>'
    +'<label class="hint" style="margin:0">Shuttlecock total<input'+(cf.fixed?" disabled":"")+' type="number" inputmode="decimal" min="0" step="0.01" data-f="cf" data-k="sh" value="'+esc(cf.sh)+'"></label>'
    +'<label class="hint" style="margin:0">Court rent total<input'+(cf.fixed?" disabled":"")+' type="number" inputmode="decimal" min="0" step="0.01" data-f="cf" data-k="ch" value="'+esc(cf.ch)+'"></label>'
    +'<label class="hint" style="margin:0">Currency symbol<input data-f="cf" data-k="sym" maxlength="3" value="'+esc(cf.sym)+'"></label><label class="hint full" style="margin:0">Fixed amount per player<input'+(cf.fixed?"":" disabled")+' type="number" inputmode="decimal" min="0" step="0.01" data-f="cf" data-k="fx" value="'+esc(cf.fx||"")+'"></label>'
    +'</div>'
    +'<div class="over" style="margin-top:10px">Total '+money(total())+'<small>'+(S.pl.length?(cf.fixed?'Fixed '+money(+cf.fx||0)+' x ':'Divided by ')+S.pl.length+' players'+(cf.fixed?'':' = '+money(total()/S.pl.length)+' each'):'Add players to calculate the total.')+'</small></div>';
  var q=S.q.map(P);
  h+='<h2>'+ic("users")+'Waiting ('+q.length+')</h2>';
  h+=q.length?'<ul class="q">'+q.map(function(p,i){
    return'<li class="'+(p.rest?"rest":"")+'"><span class="pos">#'+(i+1)+'</span><span class="nm">'+pn(p)+'<small>'+(p.g==="F"?"Woman":"Man")+', '+LV[p.l]+', '+p.w+' won, '+p.x+' lost, pays '+money(owe(p))+'</small></span><button class="sm" data-act="rest" data-v="'+p.id+'">'+(p.rest?"Back":"Rest")+'</button><button class="x" aria-label="Remove player" data-act="del" data-v="'+p.id+'">×</button></li>'}).join("")+'</ul>'
    :'<p class="hint">Nobody waiting. Add players below.</p>';
  h+='<h2>'+ic("plus")+'Add a player</h2>'+(dis?'<p class="hint">Adding players is locked while a game is running. Finish the games first.</p>':'')+'<div class="add"><input class="full" id="nm"'+dis+' placeholder="Player name" autocomplete="off" maxlength="24" aria-label="Player name">'
    +'<select data-f="ng"'+dis+' aria-label="Gender"><option value="F"'+(S.ng==="F"?" selected":"")+'>Woman</option><option value="M"'+(S.ng==="M"?" selected":"")+'>Man</option></select>'
    +'<select data-f="nl"'+dis+' aria-label="Level">'+opts(LV,S.nl)+'</select>'
    +'<button class="btn full" data-act="add"'+dis+'>'+ic("plus")+'Add player</button></div>';
  var rk=S.pl.slice().sort(function(a,b){return b.w-a.w||a.x-b.x});
  if(rk.some(function(p){return p.p}))h+='<h2>'+ic("trophy")+'Leaderboard</h2><ol class="board">'+rk.map(function(p,i){var l=i===0&&p.w>0;
    return'<li class="'+(l?"lead":"")+'"><span class="nm">'+(l?"Leading: ":"")+pn(p)+'<div class="em">'+emo(p)+'</div><small>pays '+money(owe(p))+'</small></span><span class="wl"><b>'+p.w+'</b> W &nbsp;<b>'+p.x+'</b> L</span></li>'}).join("")+'</ol>';
  if(S.pl.some(function(p){return p.p}))h+='<h2>'+ic("chart")+'Games played ranking</h2><ol class="board">'+S.pl.slice().sort(function(a,b){return b.p-a.p||a.n.localeCompare(b.n)}).map(function(p){return'<li><span class="nm">'+av(p)+esc(p.n)+'<span class="lv">'+SH[p.l]+'</span><div class="em">'+emo(p)+'</div></span><span class="wl"><b>'+p.p+'</b> GP</span></li>'}).join("")+'</ol>';
  var gm=S.g.filter(function(g){return g.ms});
  if(gm.length){var tm=gm.reduce(function(a,g){return a+g.ms},0),pc={};
    gm.forEach(function(g){pc[g.c]=pc[g.c]||[0,0];pc[g.c][0]++;pc[g.c][1]+=g.ms});
    h+='<h2>'+ic("clock")+'Game summary</h2><div class="over">'+gm.length+(gm.length===1?' game':' games')+' finished<small>Total '+mins(tm)+', average '+mins(tm/gm.length)+' per game, longest '+mins(Math.max.apply(null,gm.map(function(g){return g.ms})))+'</small></div><ul class="q">'+Object.keys(pc).map(function(k){return'<li><span class="nm">Court '+k+'<small>'+pc[k][0]+(pc[k][0]===1?' game, ':' games, ')+mins(pc[k][1])+' in total</small></span></li>'}).join("")+'</ul>';}
  if(S.h.length)h+='<h2>'+ic("list")+'Recent games</h2><ol class="hist" reversed>'+S.h.slice(-8).reverse().map(function(x){return"<li>"+x+"</li>"}).join("")+'</ol>';
  document.getElementById("app").innerHTML=h;
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var act=t.dataset.act,v=t.dataset.v,c=S.courts[+t.dataset.c];
  if(act==="rule"){snap();if(v==="rot")S.mode="rot";else{S.mode="stay";S.max=v==="s2"?2:3}}
  else if(act==="undo"){if(UNDO.length)S=JSON.parse(UNDO.pop())}
  else if(act==="nc"){
    snap();
    if(v==="1"&&S.nc<8)S.nc++;
    else if(v==="-1"&&S.nc>1){var lc=S.courts[S.nc-1];
      if(lc.run||lc.keep.length){UNDO.pop();lc.msg="Finish the game on this court before removing it."}
      else{S.q=S.q;S.courts.pop();S.nc--}}
  }
  else if(act==="ext"&&c.run){snap();c.run.end=c.run.end?c.run.end+300000:Date.now()+1200000;c.run.al=false}
  else if(act==="fx"){snap();S.cf.fixed=v==="1"}
  else if(act==="end"){if(S.courts.some(function(cc){return cc.run}))S.endmsg="Finish the running games first.";else if(confirm("End the game?")){snap();S.ended=true;S.endmsg=""}}
  else if(act==="reopen"){snap();S.ended=false}
  else if(act==="export"){exportData();return}
  else if(act==="fill"){fill(c)}
  else if(act==="go"){snap();go(c)}
  else if(act==="win"&&c.run){snap();if(result(+t.dataset.c,+v)===false)UNDO.pop()}
  else if(act==="rest"){snap();var p=P(v);p.rest=!p.rest}
  else if(act==="del"){snap();S.pl=S.pl.filter(function(p){return p.id!==v});S.q=S.q.filter(function(i){return i!==v});
    S.courts.forEach(function(cc){cc.sel=cc.sel.map(function(x){return x===v?"":x});cc.keep=cc.keep.filter(function(x){return x!==v})})}
  else if(act==="add"){
    if(S.courts.some(function(cc){return cc.run}))return;
    var n=document.getElementById("nm").value.trim();
    if(!n){document.getElementById("nm").focus();return}
    snap();var id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    S.pl.push({id:id,n:n,g:S.ng,l:+S.nl,w:0,x:0,p:0,last:null,rest:false});S.q.push(id);
  }
  save();render();
  if(act==="add"){var el=document.getElementById("nm");if(el)el.focus()}
});
document.addEventListener("change",function(e){
  var d=e.target.dataset,f=d&&d.f;if(!f||f==="sc")return;
  var nm=document.getElementById("nm"),keep=nm?nm.value:"";
  if(f==="cn"){var nv=e.target.value.split(",").map(function(x){return x.trim()}).filter(Boolean).filter(function(x,i,a){return a.indexOf(x)===i}).slice(0,12);S.cnmsg="";
    if(!nv.length)S.cnmsg="Enter at least one court number.";
    else if(S.courts.slice(nv.length).some(function(c){return c.run||c.keep.length}))S.cnmsg="Finish the games on the extra courts first.";
    else{S.cn=nv.join(", ");S.courts=S.courts.slice(0,nv.length)}}
  else if(f==="cf"){S.cf[d.k]=e.target.value}else if(f==="sel"){var c=S.courts[+d.c];c.sel[+d.s]=e.target.value;c.msg=""}
  else if(f==="ccat"){S.courts[+d.c].cat=e.target.value}
  else S[f]=e.target.value;
  save();render();
  var n2=document.getElementById("nm");if(n2)n2.value=keep;
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="nm")document.querySelector('[data-act="add"]').click();
});
document.addEventListener("input",function(e){var d=e.target.dataset;if(!d||d.f!=="sc")return;var c=S.courts[+d.c];if(!c||!c.run)return;c.run.sc=c.run.sc||["",""];c.run.sc[+d.s]=e.target.value;c.msg="";save();var m=document.getElementById("mg"+d.c);if(m)m.textContent=marg(c.run.sc)});
setInterval(function(){var b=document.querySelector('[data-act="end"]');if(b&&S.te&&!S.ended&&b.className!=="win"&&new Date().toTimeString().slice(0,5)>=S.te){b.className="win";b.textContent="Time is over: End game"}},30000);
document.addEventListener("toggle",function(e){if(e.target.id==="menu"){S.mo=e.target.open;save()}},true);
setInterval(function(){var ck=document.getElementById("clock");if(ck)ck.textContent=nowTxt();document.querySelectorAll("[data-t0]").forEach(function(el){el.textContent=fmt(Date.now()-(+el.dataset.t0))})},1000);
render();
</script>
