<title>NetPlay Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4fd;--surface:#fff;--ink:#2e2a4f;--mute:#6f6a8d;--line:#e5dff3;--court:#c9ecde;--court-ink:#1d3b34;--cork:#ffd7a6;--cork-ink:#4a2e0b;--danger:#d6566a;--ov1:rgba(29,59,52,.10);--ov2:rgba(29,59,52,.28);--okbg:#bde7cb;--okink:#1d5a38;--badbg:#f8c9d1;--badink:#7a2434;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a2e;--surface:#28243d;--ink:#ede9fb;--mute:#aaa5c8;--line:#3b3659;--court:#3f6b61;--court-ink:#eefaf5;--danger:#ef8294;--ov1:rgba(255,255,255,.16);--ov2:rgba(255,255,255,.30);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a2e;--surface:#28243d;--ink:#ede9fb;--mute:#aaa5c8;--line:#3b3659;--court:#3f6b61;--court-ink:#eefaf5;--danger:#ef8294;--ov1:rgba(255,255,255,.16);--ov2:rgba(255,255,255,.30);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:26px;font-weight:800;margin:4px 0 12px;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cork);outline-offset:2px}
select,input{padding:11px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;width:100%;font-size:15px}
select option{color:var(--ink);background:var(--surface)}
.court{background:var(--court);color:var(--court-ink);border-radius:16px;padding:14px;position:relative;border:2px solid var(--ov1);margin-bottom:12px;box-shadow:0 6px 18px rgba(46,42,79,.10)}
.court.m .sides{position:relative}
.court.m .sides::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--ov2);pointer-events:none}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}

ys use the same browser","استخدم المتصفح نفسه دائمًا","Laging gamitin ang parehong browser","हमेशा एक ही ब्राउज़र का उपयोग करें"],["Which browser to use, and how to keep your data safe.","أي متصفح تستخدم، وكيف تحافظ على بياناتك.","Aling browser ang gagamitin, at paano mapapanatiling ligtas ang data mo.","कौन सा ब्राउज़र उपयोग करें, और अपना डेटा सुरक्षित कैसे रखें।"],["Your players, payments and Pro unlock are saved inside this browser only.","لاعبوك ومدفوعاتك وتفعيل برو محفوظة داخل هذا المتصفح فقط.","Ang mga manlalaro, bayad at Pro unlock mo ay naka-save sa browser na ito lang.","आपके खिलाड़ी, भुगतान और प्रो अनलॉक केवल इसी ब्राउज़र में सहेजे जाते हैं।"],["1. Always use the same browser","1. استخدم المتصفح نفسه دائمًا","1. Laging gamitin ang parehong browser","1. हमेशा एक ही ब्राउज़र का उपयोग करें"],["Your players, payments and Pro unlock are saved inside the browser you use. If you open NetPlay in another browser, you will see an empty app.","لاعبوك ومدفوعاتك وتفعيل برو محفوظة داخل المتصفح الذي تستخدمه. إذا فتحت NetPlay في متصفح آخر، سترى تطبيقًا فارغًا.","Ang mga manlalaro, bayad at Pro unlock mo ay naka-save sa browser na ginagamit mo. Kapag binuksan mo ang NetPlay sa ibang browser, walang laman ang makikita mo.","आपके खिलाड़ी, भुगतान और प्रो अनलॉक उसी ब्राउज़र में सहेजे जाते हैं जिसका आप उपयोग करते हैं। NetPlay को किसी दूसरे ब्राउज़र में खोलने पर आपको खाली ऐप दिखेगा।"],["2. Your Pro code works in one browser","2. رمز برو يعمل في متصفح واحد","2. Sa isang browser lang gumagana ang Pro code mo","2. आपका प्रो कोड एक ही ब्राउज़र में काम करता है"],["The Device ID is different in every browser. A Pro code made for one browser will not unlock another one, even on the same phone.","معرّف الجهاز يختلف في كل متصفح. رمز برو المُعدّ لمتصفح واحد لن يفتح متصفحًا آخر، حتى على الهاتف نفسه.","Iba ang Device ID sa bawat browser. Ang Pro code na ginawa para sa isang browser ay hindi magbubukas sa iba, kahit sa parehong telepono.","हर ब्राउज़र में डिवाइस आईडी अलग होती है। एक ब्राउज़र
