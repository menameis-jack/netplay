.hist{margin:0;padding-left:18px;color:var(--mute);font-size:14px}

    return'<li class="'+(l?"lead":"")+'"><span class="nm">'+(l?"Leading: ":"")+pn(p)+'<div class="em">'+emo(p)+'</div><small>pays '+money(owe(p))+'</small></span><span class="wl"><b>'+p.w+'</b> W &nbsp;<b>'+p.x+'</b> L</span></li>'}).join("")+'</ol>';
  if(S.pl.some(function(p){return p.p}))h+='<h2>'+ic("chart")+'Games played ranking</h2><ol class="board">'+S.pl.slice().sort(function(a,b){return b.p-a.p||a.n.localeCompare(b.n)}).map(function(p){return'<li><span class="nm">'+av(p)+esc(p.n)+'<span class="lv">'+SH[p.l]+'</span><div class="em">'+emo(p)+'</div></span><span class="wl"><b>'+p.p+'</b> GP</span></li>'}).join("")+'</ol><button class="ghost" style="margin-top:10px" data-act="rkpdf">'+ic("down")+'Export ranking (PDF)</button><p class="hint" id="rkmsg" style="margin:6px 0 0"></p>';
  var gm=S.g.filter(function(g){return g.ms});
  if(gm.length){var tm=gm.reduce(function(a,g){return a+g.ms},0),pc={};
    gm.forEach(function(g){pc[g.c]=pc[g.c]||[0,0];pc[g.c][0]++;pc[g.c][1]+=g.ms});
    h+='<h2>'+ic("clock")+'Game summary</h2><div class="over">'+gm.length+(gm.length===1?' game':' games')+' finished<small>Total '+mins(tm)+', average '+mins(tm/gm.length)+' per game, longest '+mins(Math.max.apply(null,gm.map(function(g){return g.ms})))+'</small></div><ul class="q">'+Object.keys(pc).map(function(k){return'<li><span class="nm">Court '+k+'<small>'+pc[k][0]+(pc[k][0]===1?' game, ':' games, ')+mins(pc[k][1])+' in total</small></span></li>'}).join("")+'</ul>';}
  if(S.h.length)h+='<h2>'+ic("list")+'Recent games</h2><ol class="hist" reversed>'+S.h.slice(-8).reverse().map(function(x){return"<li>"+x+"</li>"}).join("")+'</ol>';
  h+='</div></div>';
  document.getElementById("app").innerHTML=h;
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var act=t.dataset.act,v=t.dataset.v,c=S.courts[+t.dataset.c];
  if(act==="rule"){snap();if(v==="rot")S.mode="rot";else{S.mode="stay";S.max=v==="s2"?2:3}}
  else if(act==="undo"){if(UNDO.length)S=JSON.parse(UNDO.pop())}
  else if(act==="nc"){
    snap();
    if(v==="1"&&S.nc<8)S.nc++;
    else if(v==="-1"&&S.nc>1){var lc=S.courts[S.nc-1];
      if(lc.run||lc.keep.length){UNDO.pop();lc.msg="Finish the game on this court before removing it."}
      else{S.q=S.q;S.courts.pop();S.nc--}}
  }
  else if(act==="ext"&&c.run){snap();c.run.end=c.run.end?c.run.end+300000:Date.now()+1200000;c.run.al=false}
  else if(act==="ws"){S.ws=v}
  else if(act==="pf"){S.pf=v;S.pmsg=""}
  else if(act==="punlock"){var pi=document.getElementById("pin");if(pi&&hp(pi.value)===S.ppin){UNL=true;S.pmsg=""}else S.pmsg="Wrong PIN."}
  else if(act==="ppin"){if(!canEdit())return;var np=document.getElementById("pnew").value.trim();S.ppin=np?hp(np):"";UNL=true;S.pmsg=np?"PIN saved. Payments lock again when you reload.":"PIN removed."}
  else if(act==="pgo"||act==="pgoq"){
    if(act==="pgoq")S.po=true;
    if(!canEdit()){S.po=true;S.pmsg="Unlock payments with the PIN first."}
    else{S.pp=(act==="pgo"&&S.pp===v)?null:v;S.ptok=S.pp?uid():null;S.pmsg="";if(act==="pgoq"){S.pf="all";S.ps=""}}}
  else if(act==="pcancel"){S.pp=null;S.ptok=null}
  else if(act==="psave"){if(!canEdit())return;payForm(v)}
  else if(act==="pfull"){if(!canEdit())return;payFull(P(v))}
  else if(act==="pex"){if(!canEdit())return;var px=P(v),rx=pr(px);if(!rx.ex&&paidOf(px)>.005)S.pmsg="This player has payments. Reverse them first.";else{snap();rx.ex=!rx.ex;aud(px,rx.ex?"Marked exempted":"Exemption removed");S.pmsg=""}}
  else if(act==="prv"){if(!canEdit())return;S.rv=S.rv===v?null:v}
  else if(act==="prvx"){S.rv=null}
  else if(act==="prvc"){if(!canEdit())return;revTx(v)}
  else if(act==="rkpdf"){exportRankPdf();return}
  else if(act==="pxl"){if(canEdit())exportXlsx();return}
  else if(act==="ppdf"){if(canEdit())exportPdf();return}
  else if(act==="lay"){S.lay=v;if(window.applyLayout)applyLayout()}
  else if(act==="fx"){snap();S.cf.fixed=v==="1"}
  else if(act==="end"){if(S.courts.some(function(cc){return cc.run}))S.endmsg="Finish the running games first.";else{if(!armed("end",t,"Tap again to end the game"))return;snap();S.ended=true;S.endmsg=""}}
  else if(act==="reopen"){if(!armed("reopen",t,"Tap again to clear everything and start blank"))return;snap();
    S.led=S.led||[];S.led.forEach(function(x){x.arc=1});S.ha=(S.ha||[]).concat(S.h||[]);S.h=[];S.ga=(S.ga||[]).concat(S.g||[]);S.g=[];S.auda=(S.auda||[]).concat(S.aud||[]);S.aud=[];
    S.ended=false;S.endmsg="";S.pl=[];S.q=[];S.pay={};S.pp=null;S.ptok=null;S.rv=null;S.pf="all";S.ps="";S.pmsg="";S.gd=today();S.ts="";S.te="";
    S.courts.forEach(function(cc){cc.run=null;cc.keep=[];cc.s=0;cc.sel=["","","",""];cc.last=null;cc.msg=""})}
  else if(act==="export"){exportData();return}
  else if(act==="creset"){snap();S.q=S.q.concat(c.keep);c.keep=[];c.s=0;c.sel=["","","",""];c.last=null;c.msg=""}
  else if(act==="fill"){fill(c)}
  else if(act==="go"){snap();go(c)}
  else if(act==="win"&&c.run){snap();if(result(+t.dataset.c,+v)===false)UNDO.pop()}
  else if(act==="rest"){snap();var p=P(v);p.rest=!p.rest}
  else if(act==="clear"){if(!S.q.length)return;if(!armed("clear",t,"Tap again to remove all "+S.q.length+" waiting players"))return;{snap();var gone=S.q.slice();S.pl=S.pl.filter(function(p){return gone.indexOf(p.id)<0});S.q=[];S.courts.forEach(function(cc){cc.sel=cc.sel.map(function(x){return gone.indexOf(x)<0?x:""});cc.keep=cc.keep.filter(function(x){return gone.indexOf(x)<0})})}}
  else if(act==="del"){if(!armed("del"+v,t,"Remove?"))return;snap();S.pl=S.pl.filter(function(p){return p.id!==v});S.q=S.q.filter(function(i){return i!==v});
    S.courts.forEach(function(cc){cc.sel=cc.sel.map(function(x){return x===v?"":x});cc.keep=cc.keep.filter(function(x){return x!==v})})}
  else if(act==="add"){
    if(S.courts.some(function(cc){return cc.run}))return;
    var n=document.getElementById("nm").value.trim();
    if(!n){try{document.getElementById("nm").focus({preventScroll:true})}catch(er){}return}
    snap();var id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    S.pl.push({id:id,n:n,g:S.ng,l:+S.nl,w:0,x:0,p:0,last:null,rest:false});S.q.push(id);
  }
  var cr0=document.querySelector(".colR"),cst=cr0?cr0.scrollTop:0,nm0=document.getElementById("nm"),ny=nm0?nm0.getBoundingClientRect().top:0,sy=window.scrollY,sel='[data-act="'+act+'"]'+(v!=null?'[data-v="'+v+'"]':'')+(t.dataset.c!=null?'[data-c="'+t.dataset.c+'"]':'');
  save();render();window.scrollTo(0,sy);if(cr0){var cr1=document.querySelector(".colR");if(cr1)cr1.scrollTop=cst}
  if(act!=="add"){var nb=document.querySelector(sel);if(nb&&nb.focus)try{nb.focus({preventScroll:true})}catch(er){}}
  if(act==="add"){var el=document.getElementById("nm");if(el){if(nm0&&nm0!==el&&nm0.isConnected===false){nm0.value="";el.replaceWith(nm0);el=nm0}try{el.focus({preventScroll:true})}catch(er){el.focus()}var fx=function(){var q=document.getElementById("nm");if(!q)return;var d=q.getBoundingClientRect().top-ny,cc=q.closest(".colR");if(cc&&cc.scrollHeight>cc.clientHeight)cc.scrollTop+=d;else window.scrollBy(0,d)};fx();setTimeout(fx,60)}}
  if(act==="pgoq"||act==="pgo"){var fe=document.getElementById("pform");if(fe)fe.scrollIntoView({block:"center"})}
});
document.addEventListener("change",function(e){
  if(e.target.id==="pm"||e.target.id==="dm"){S.lm=e.target.value;save();var o=document.getElementById(e.target.id==="pm"?"dm":"pm");if(o)o.value=S.lm;return}
  var d=e.target.dataset,f=d&&d.f;if(!f||f==="sc")return;
  var nm=document.getElementById("nm"),keep=nm?nm.value:"";
  if(f==="cn"){var nv=e.target.value.split(",").map(function(x){return x.trim()}).filter(Boolean).filter(function(x,i,a){return a.indexOf(x)===i}).slice(0,12);S.cnmsg="";
    if(!nv.length)S.cnmsg="Enter at least one court number.";
    else if(S.courts.slice(nv.length).some(function(c){return c.run||c.keep.length}))S.cnmsg="Finish the games on the extra courts first.";
    else{S.cn=nv.join(", ");S.courts=S.courts.slice(0,nv.length)}}
  else if(f==="cf"){S.cf[d.k]=e.target.value}else if(f==="sel"){var c=S.courts[+d.c];c.sel[+d.s]=e.target.value;c.msg=""}
  else if(f==="ccat"){S.courts[+d.c].cat=e.target.value}
  else S[f]=e.target.value;
  save();render();
  var n2=document.getElementById("nm");if(n2)n2.value=keep;
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="nm")document.querySelector('[data-act="add"]').click();
});
document.addEventListener("input",function(e){var d=e.target.dataset;if(!d||d.f!=="sc")return;var c=S.courts[+d.c];if(!c||!c.run)return;c.run.sc=c.run.sc||["",""];c.run.sc[+d.s]=e.target.value;c.msg="";save();var m=document.getElementById("mg"+d.c);if(m)m.textContent=marg(c.run.sc)});
setInterval(function(){var b=document.querySelector('[data-act="end"]');if(b&&S.te&&!S.ended&&b.className!=="win"&&new Date().toTimeString().slice(0,5)>=S.te){b.className="win";b.textContent="Time is over: End game"}},30000);
document.addEventListener("input",function(e){var i=e.target.id;
  if(i==="psrch"){S.ps=e.target.value;var l=document.getElementById("paylist");if(l)l.innerHTML=payList()}
  else if(i==="pa"||i==="pdue")balPreview()});
document.addEventListener("toggle",function(e){var i=e.target.id;if(i==="menu"||i==="paymenu"){S[i==="menu"?"mo":"po"]=e.target.open;save()}},true);
setInterval(function(){var ck=document.getElementById("clock");if(ck)ck.textContent=nowTxt();document.querySelectorAll("[data-t0]").forEach(function(el){el.textContent=fmt(Date.now()-(+el.dataset.t0))})},1000);
render();
</script>
</body>
